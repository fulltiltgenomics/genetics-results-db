[project]
name = "genetics-results-db"
version = "0.1.0"
description = "BigQuery database for genetics fine-mapping, colocalization, and exome sequencing results with a REST API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.43.0",
    "google-cloud-bigquery>=3.41.0",
    "pydantic>=2.12.5",
    # exact, like the siblings pin it (genetics-mcp-server 2.11.0, genetics-results-api
    # 2.12.1): this is the dependency that validates sandbox tokens, and the previous
    # `>=2.10` left it free to drift on a rebuild. The 2.10 floor still matters — that is
    # where a *future* `iat` became ImmatureSignatureError, i.e. where post-dating a token
    # stopped being possible, which is why sandbox_auth.LEEWAY_SECONDS exists to absorb
    # minter/verifier clock skew — so never move this below it. Anti-backdating is a
    # separate property and does not come from here: PyJWT accepts an arbitrarily old `iat`
    # as long as `exp` is in the future, and sandbox_auth's own MAX_TOKEN_AGE_SECONDS check
    # is what enforces it, at every version.
    "PyJWT==2.13.0",
    "pyyaml>=6.0",
    "polars>=1.37.0",
    "gcsfs>=2026.4.0",
]

[project.optional-dependencies]
# httpx is what starlette's TestClient drives, so tests/ cannot even import without it
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # shuffles test order every run. Declared (genetics-results-suite-xi6) so the shuffling is
    # part of the documented `uv pip install -e '.[dev]'` flow rather than an accident of which
    # interpreter you happen to run pytest with: it was present in the global pyenv but NOT in
    # this project's .venv, so the seed that turned nine auth tests red — a real order
    # dependence in api.main, since fixed — was only reachable outside the declared setup.
    # `-p no:randomly` restores a fixed order when bisecting.
    "pytest-randomly>=4.0",
]
